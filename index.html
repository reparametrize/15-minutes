<!DOCTYPE html>
<html>
<head>
  <title>15-Minute City Interactive Map (MapLibre)</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .info-box { 
      position: absolute; 
      top: 20px; 
      left: 20px; 
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 16px; 
      border-radius: 12px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 999;
      font-size: 0.95em;
      color: #333;
      max-width: 300px;
      line-height: 1.4;
    }
    .style-selector { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 12px; 
      border-radius: 12px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .style-selector label {
      color: #333;
      font-size: 0.9em;
      font-weight: 500;
    }
    .style-selector select {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.9em;
      color: #333;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .style-selector select:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }
    .style-selector select:focus {
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
    }
    #closeSidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #closeSidebar:hover {
      background: rgba(255, 255, 255, 1);
      color: #333;
      transform: scale(1.05);
    }
    #sidebar { 
      display: none; 
      position: absolute; 
      top: 60px; 
      right: 30px; 
      width: 340px; 
      max-height: 80vh; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1001; 
      overflow-y: auto; 
      padding: 20px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #sidebar h3 { 
      margin-top: 0; 
      font-size: 1.2em; 
      color: #333;
    }
    #sidebar .field-label { 
      color: #666; 
      font-size: 0.85em; 
      margin-top: 15px; 
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #sidebar .field-value { 
      font-size: 1em; 
      margin-bottom: 12px; 
      color: #333;
      line-height: 1.4;
    }
    #sidebar hr { 
      border: none; 
      border-top: 1px solid #eee; 
      margin: 15px 0; 
    }
    #sidebar .category-tag {
      display: inline-flex;
      align-items: center;
      background: rgba(245, 245, 245, 0.9);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 8px 14px;
      border-radius: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    #sidebar .category-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    #sidebar .category-name {
      font-size: 0.9em;
      color: #666;
    }
    #sidebar .place-name {
      font-size: 1.4em;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    #sidebar .all-data {
      background: rgba(248, 248, 248, 0.9);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    #sidebar .all-data-label {
      color: #666;
      font-size: 0.85em;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #sidebar .all-data-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #sidebar .data-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #sidebar .section-title {
      color: #333;
      font-size: 0.95em;
      font-weight: 600;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    #sidebar .data-item {
      background: rgba(255, 255, 255, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #sidebar .data-label {
      color: #666;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    #sidebar .data-value {
      color: #333;
      font-size: 0.95em;
      line-height: 1.4;
    }
    /* Style for scrollbar */
    #sidebar::-webkit-scrollbar {
      width: 8px;
    }
    #sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    #sidebar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    #sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
    /* Style for links */
    a {
      color: #0066cc;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #004499;
      text-decoration: underline;
    }
    .search-box {
      position: absolute;
      top: 20px;
      left: 85%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 300px;
    }
    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 4px 8px;
      font-size: 0.9em;
      color: #333;
      outline: none;
    }
    .search-box button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.2s;
    }
    .search-box button:hover {
      background: #0052a3;
    }
    /* Export button styles */
    .export-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95em;
      color: #333;
      cursor: pointer;
      display: none;
      z-index: 1001;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }
    .export-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
    }
    .export-menu {
      position: absolute;
      bottom: 100%;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 8px 0;
      margin-bottom: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      display: none;
      min-width: 150px;
    }
    .export-menu.show {
      display: block;
    }
    .export-option {
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s;
      color: #333;
      font-size: 0.9em;
    }
    .export-option:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .logo {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 300px; /* يمكن تعديل الحجم حسب الحاجة */
      height: auto;
      z-index: 1000; /* للتأكد أنها تظهر فوق المحتوى الآخر */
    }

  </style>
</head>
<body>
  <img src="RPF4-preview.png" alt="Logo" class="logo">
  <div id="map"></div>
  <div class="info-box" id="info">Click on the map to generate a 15-minute walking zone and see nearby services.</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for a location...">
    <button onclick="searchLocation()">Search</button>
  </div>
  <div class="export-btn" id="exportBtn">
    Export Data
    <div class="export-menu" id="exportMenu">
      <div class="export-option" onclick="exportData('json')">JSON</div>
      <div class="export-option" onclick="exportData('csv')">CSV</div>
      <div class="export-option" onclick="exportData('excel')">Excel</div>
      <div class="export-option" onclick="exportData('pdf')">PDF</div>
    </div>
  </div>
  <div id="sidebar" style="display:none; position: absolute; top: 60px; right: 30px; width: 340px; max-height: 80vh; background: rgba(255,255,255,0.97); border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.18); z-index: 1001; overflow-y: auto; padding: 20px;">
    <button id="closeSidebar" style="position:absolute;top:10px;right:10px;background:none;border:none;font-size:22px;cursor:pointer;">&times;</button>
    <div id="sidebar-content"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    // Category and color table
    const categoryColors = {
      'Transportation': '#FF8A65',
      'Sports': '#4DD0E1',
      'Sustenance': '#4FC3F7',
      'Outdoor leisure & activities': '#26C6DA',
      'Financial': '#4DB6AC',
      'Other retail': '#26D7AE',
      'Groceries': '#FFEB3B',
      'Education': '#9575CD',
      'Healthcare': '#66BB6A',
      'Entertainment & Culture': '#EC407A',
      'Other': '#888'
    };

    // Function to extract main category based on point properties
    function getMainCategory(props) {
      const cats = props.categories || [];
      if (cats.some(c => /transport|bus|train|public_transport|parking|building\.transportation/.test(c))) return 'Transportation';
      if (cats.some(c => /sport|activity\.sport_club/.test(c))) return 'Sports';
      if (cats.some(c => /catering|restaurant|cafe|fast_food|bar|pub/.test(c))) return 'Sustenance';
      if (cats.some(c => /leisure|park|playground|spa|picnic/.test(c))) return 'Outdoor leisure & activities';
      if (cats.some(c => /financial|bank|atm|payment_terminal/.test(c))) return 'Financial';
      if (cats.some(c => /commercial|shopping_mall|marketplace|store|retail/.test(c))) return 'Other retail';
      if (cats.some(c => /supermarket|food_and_drink|convenience/.test(c))) return 'Groceries';
      if (cats.some(c => /education|school|college|university|library/.test(c))) return 'Education';
      if (cats.some(c => /healthcare|hospital|clinic|pharmacy/.test(c))) return 'Healthcare';
      if (cats.some(c => /entertainment|cinema|museum|culture|theatre/.test(c))) return 'Entertainment & Culture';
      return 'Other';
    }

    // Initialize map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.stadiamaps.com/styles/alidade_smooth.json', // Using Stadia Maps light style
      center: [36.3069, 33.5138], // Damascus coordinates
      zoom: 13
    });

    let marker, isochroneGeojson;

    async function getIsochrone(lat, lon) {
      const apiKey = '769d08cda50d4c26aa5798caef6bb4c4';
      const url = `https://api.geoapify.com/v1/isoline?lat=${lat}&lon=${lon}&type=time&mode=walk&range=900&apiKey=${apiKey}`;
      const res = await fetch(url);
      return res.json();
    }

    async function getPlacesWithinIsochrone(lat, lon) {
      const apiKey = '769d08cda50d4c26aa5798caef6bb4c4';
      const categories = 'catering.restaurant,catering.cafe,catering.fast_food,catering.bar,catering.pub,leisure.park,leisure.playground,leisure.spa,leisure.picnic,activity.sport_club,sport,entertainment,entertainment.cinema,entertainment.museum,entertainment.culture.theatre,entertainment.culture,education.school,education.college,education.university,education.library,service.financial.bank,service.financial.atm,service.financial.payment_terminal,commercial,commercial.supermarket,commercial.shopping_mall,commercial.marketplace,commercial.food_and_drink,commercial.convenience,healthcare,healthcare.hospital,healthcare.clinic_or_praxis,healthcare.pharmacy,public_transport,building.transportation,parking,building.parking,public_transport.bus,public_transport.train,building.place_of_worship,tourism.sights.place_of_worship.church,tourism.sights.place_of_worship.mosque,tourism.sights.place_of_worship.synagogue,tourism.sights.place_of_worship.temple';
      const encodedCat = encodeURIComponent(categories);
      const url = `https://api.geoapify.com/v2/places?categories=${encodedCat}&filter=circle:${lon},${lat},1000&limit=500&apiKey=${apiKey}`;
      const res = await fetch(url);
      if (!res.ok) {
        return { features: [] };
      }
      return res.json();
    }

    map.on('click', async (e) => {
      // If click is on a point (places-circle), ignore this event
      const features = map.queryRenderedFeatures(e.point, { layers: ['places-circle'] });
      if (features.length > 0) return;

      const { lng, lat } = e.lngLat;
      if (marker) marker.remove();
      marker = new maplibregl.Marker({color: 'red'}).setLngLat([lng, lat]).addTo(map);

      // Remove previous layers/sources
      ['iso','places','places-circle'].forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
        if (map.getSource(id)) map.removeSource(id);
      });

      // Get isochrone
      const isoData = await getIsochrone(lat, lng);
      isochroneGeojson = isoData;
      map.addSource('iso', { type:'geojson', data:isoData });
      map.addLayer({ id:'iso', type:'line', source:'iso', paint:{'line-color':'#f00','line-width':3} });

      // Get places
      const placesRes = await getPlacesWithinIsochrone(lat, lng);
      // Remove old custom markers
      document.querySelectorAll('.custom-marker').forEach(el=>el.remove());
      let count=0;
      const polygon = isoData.features?.[0];
      const pointsGeojson = { type: 'FeatureCollection', features: [] };

      for (const f of placesRes.features || []) {
        const coords = f.geometry.coordinates;
        if (polygon && turf.booleanPointInPolygon(turf.point(coords), polygon)) {
          const mainCategory = getMainCategory(f.properties);
          const color = categoryColors[mainCategory] || categoryColors['Other'];
          pointsGeojson.features.push({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: coords },
            properties: { ...f.properties, color, mainCategory }
          });
          count++;
        }
      }
      map.addSource('places-circle', { type: 'geojson', data: pointsGeojson });
      map.addLayer({
        id: 'places-circle',
        type: 'circle',
        source: 'places-circle',
        paint: {
          'circle-radius': 7,
          'circle-color': ['get', 'color'],
          'circle-stroke-width': 2,
          'circle-stroke-color': '#fff',
          'circle-opacity': 0.85
        }
      });
      // Show Generate button immediately after adding points
      showGenerateButton(pointsGeojson);
      // Add click and hover events on points (only once)
      map.on('click', 'places-circle', function(e) {
        const feature = e.features[0];
        showSidebar(feature.properties);
      });
      map.on('mouseenter', 'places-circle', function() {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'places-circle', function() {
        map.getCanvas().style.cursor = '';
      });
      document.getElementById('info').innerText = `Found ${count} nearby services at (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
    });
    // دالة عرض نافذة المعلومات الجانبية
    function showSidebar(props) {
      const name = props.name || props['name:en'] || 'Unnamed Place';
      const mainCategory = props.mainCategory || getMainCategory(props);
      const color = categoryColors[mainCategory] || categoryColors['Other'];
      const address = props.address_line1 || props['addr:street'] || '';
      const phone = props.phone || props['contact:phone'] || '';
      const website = props.website || '';

      // Helper function to format keys
      function formatKey(key) {
        return key
          .replace(/_/g, ' ')
          .replace(/([A-Z])/g, ' $1')
          .replace(/^./, str => str.toUpperCase());
      }

      // Helper function to parse JSON strings
      function parseJsonString(str) {
        try {
          return JSON.parse(str);
        } catch {
          return null;
        }
      }

      // Helper function to format data
      function formatData(props) {
        const data = {
          basic: {},
          location: {},
          contact: {},
          details: {}
        };

        // البيانات الأساسية
        if (props.name) data.basic['Name'] = props.name;
        if (props.ref) data.basic['Reference'] = props.ref;
        if (props.operator) data.basic['Operator'] = props.operator;
        if (props.building) {
          const building = parseJsonString(props.building);
          if (building) {
            if (building.type) data.basic['Building Type'] = building.type;
            if (building.height) data.basic['Building Height'] = `${building.height}m`;
          }
        }

        // معلومات الموقع
        if (props.address_line1) data.location['Address'] = props.address_line1;
        if (props.address_line2) data.location['Address Line 2'] = props.address_line2;
        if (props.city) data.location['City'] = props.city;
        if (props.state) data.location['State'] = props.state;
        if (props.postcode) data.location['Postal Code'] = props.postcode;
        if (props.country) data.location['Country'] = props.country;
        if (props.neighbourhood) data.location['Neighbourhood'] = props.neighbourhood;
        if (props.district) data.location['District'] = props.district;

        // معلومات الاتصال
        if (props.website) data.contact['Website'] = props.website;
        if (props.phone) data.contact['Phone'] = props.phone;

        // تفاصيل إضافية
        if (props.facilities) {
          const facilities = parseJsonString(props.facilities);
          if (facilities) {
            Object.entries(facilities).forEach(([key, value]) => {
              data.details[formatKey(key)] = value ? 'Yes' : 'No';
            });
          }
        }

        if (props.place_of_worship) {
          const worship = parseJsonString(props.place_of_worship);
          if (worship && worship.religion) {
            data.details['Religion'] = worship.religion;
          }
        }

        return data;
      }

      const formattedData = formatData(props);
      
      let html = `
        <div class="category-tag">
          <span class="category-dot" style="background: ${color}"></span>
          <span class="category-name">${mainCategory}</span>
        </div>
        <div class="place-name">${name}</div>
        ${address ? `
          <div class="field-label">Address</div>
          <div class="field-value">${address}</div>
        ` : ''}
        ${phone ? `
          <div class="field-label">Phone</div>
          <div class="field-value">${phone}</div>
        ` : ''}
        ${website ? `
          <div class="field-label">Website</div>
          <div class="field-value"><a href="${website}" target="_blank" style="color: #0066cc; text-decoration: none;">${website}</a></div>
        ` : ''}
        <div class="all-data">
          <div class="all-data-label">All Data</div>
          <div class="all-data-content">
            ${Object.entries(formattedData).map(([section, items]) => `
              ${Object.keys(items).length > 0 ? `
                <div class="data-section">
                  <div class="section-title">${formatKey(section)}</div>
                  ${Object.entries(items).map(([key, value]) => `
                    <div class="data-item">
                      <div class="data-label">${key}</div>
                      <div class="data-value">${value}</div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            `).join('')}
          </div>
        </div>
      `;
      
      document.getElementById('sidebar-content').innerHTML = html;
      document.getElementById('sidebar').style.display = 'block';
    }
    document.getElementById('closeSidebar').onclick = function() {
      document.getElementById('sidebar').style.display = 'none';
    };

    // Add Generate button on top of the map (appears only after points load)
    let generateBtn = document.getElementById('generateBtn');
    if (!generateBtn) {
      generateBtn = document.createElement('button');
      generateBtn.id = 'generateBtn';
      generateBtn.innerText = 'Generate';
      generateBtn.style.display = 'none';
      generateBtn.style.position = 'absolute';
      generateBtn.style.bottom = '30px';
      generateBtn.style.left = '30px';
      generateBtn.style.top = '';
      generateBtn.style.right = '';
      generateBtn.style.zIndex = '1100';
      generateBtn.style.padding = '14px 36px';
      generateBtn.style.background = 'rgba(255,255,255,0.85)';
      generateBtn.style.backdropFilter = 'blur(10px)';
      generateBtn.style.border = '1px solid rgba(255,255,255,0.2)';
      generateBtn.style.borderRadius = '18px';
      generateBtn.style.boxShadow = '0 8px 32px rgba(0,0,0,0.10)';
      generateBtn.style.fontSize = '1.15em';
      generateBtn.style.fontWeight = '700';
      generateBtn.style.color = '#0077b6';
      generateBtn.style.cursor = 'pointer';
      generateBtn.style.transition = 'all 0.2s';

      const infoIcon = document.getElementById('infoIcon');

      const methodologyExplanation = `<h4 style="margin-top:0; color:#fff; font-size:1em;">Data Analysis Methodology</h4><p style="margin-bottom:5px;">The 15-Minute City score is calculated based on several key metrics:</p><ul style="list-style-type: disc; margin:0; padding-left:20px;"><li><b>Essential Services:</b> Coverage of critical services like healthcare, education, groceries, and transportation.</li><li><b>Diversity:</b> Number of unique service categories available.</li><li><b>Density:</b> Concentration of services within the walking zone.</li><li><b>Balance:</b> Evenness of distribution across different service categories (Shannon entropy normalized).</li></ul><p style="margin-top:10px;">Each metric is scored out of a maximum value, and then weighted to contribute to the overall 100-point score.</p><p style="margin-top:5px; font-size:0.75em; color:#bbb;">Scores are also adjusted by quality factors for a more realistic assessment.</p>`;

    function showAnalysisSidebar(features) {

      const essentialsPresent = essentialCats.filter(cat => categoryCounts[cat] > 0).length;

      // Professional metrics calculation
      // Score: 40% coverage of essentials, 30% diversity, 20% density, 10% balance
      let essentialsScore = (essentialsPresent / essentialCats.length) * 40;
      let diversityScore = Math.min(1, uniqueCats / Object.keys(categoryColors).length) * 30;
      let densityScore = Math.min(1, total / 60) * 20; // 60+ services = max density
      // Balance: how even is the distribution (Shannon entropy normalized)
      let entropy = 0;
      if (total > 0) {
        for (const cat in categoryCounts) {
          const p = categoryCounts[cat] / total;
          entropy -= p * Math.log2(p);
        }
        entropy = entropy / Math.log2(Object.keys(categoryColors).length); // normalized
      }
      let balanceScore = entropy * 10;
      let score = Math.round(essentialsScore + diversityScore + densityScore + balanceScore);

      // Advanced Analytics
      const advancedAnalytics = {
        serviceDensity: (total / 0.785).toFixed(2), // services per km² (assuming 15-min walk radius)

        distributionBalance: (entropy * 100).toFixed(1),
        topCategories: Object.entries(categoryCounts)
          .sort((a,b) => b[1] - a[1])
          .slice(0,3)
          .map(([cat, count]) => ({category: cat, count, percentage: ((count/total)*100).toFixed(1)})),
        rareCategories: Object.entries(categoryCounts)
          .filter(([cat, count]) => count <= 2 && count > 0 && !essentialCats.includes(cat))

        missingEssentials: essentialCats.filter(cat => !categoryCounts[cat] || categoryCounts[cat] === 0),
        serviceQuality: calculateServiceQuality(categoryCounts),

        communityScore: calculateCommunityScore(categoryCounts)

      const pieRadius = 62.5;
      const pieCenterX = 75;
      const pieCenterY = 75;
      pieData.forEach((v,i)=>{
        if (!v) return;
        const a0 = angle, a1 = angle + v/sum*2*Math.PI;
        const x0 = pieCenterX + pieRadius*Math.cos(a0), y0 = pieCenterY + pieRadius*Math.sin(a0);

      // Calculate normalized scores for each metric with more realistic thresholds
      const calculateScore = (value, max, min = 0) => {
        // Ensure minimum value is at least 0.05 (5%)
        const normalizedValue = Math.max(0.05, Math.min(1, (value - min) / (max - min)));

      const radarMap = {

        'Healthcare': calculateScore(

        'Education': calculateScore(

        'Cultural': calculateScore(

          2   // Minimum expected sustainability services
        )
      };

      // Add quality factors to adjust scores
      const qualityFactors = {
        'Essential Services': 0.9,  // Slightly reduce score to account for quality
        'Transportation': 0.85,     // Consider service quality and coverage
        'Healthcare': 0.9,          // Consider facility size and type
        'Education': 0.85,          // Consider institution level
        'Retail': 0.8,             // Consider variety and size
        'Recreation': 0.85,         // Consider facility quality
        'Cultural': 0.8,           // Consider venue type and size
        'Green Spaces': 0.9,        // Consider park size and quality
        'Community': 0.85,          // Consider community engagement
        'Safety': 0.9,             // Consider service coverage
        'Sustainability': 0.85      // Consider environmental impact
      };

      // Apply quality factors to final scores
      const radarValues = radarLabels.map(lbl => radarMap[lbl] * qualityFactors[lbl]);

      // Generate radar chart SVG
      let radarPolygon = '';
      let radarPoints = '';
      radarLabels.forEach((lbl,i)=>{
        const angle = (Math.PI*2/radarLabels.length)*i-Math.PI/2;

      });

      // Add radar grid lines with percentage labels
      const radarGrid = Array.from({length: 4}, (_, i) => {

            ${radarGrid}

        <div style="font-weight:600;margin-bottom:3px;">${cat}</div>
        <div style="color:#0077b6">
          <span style="font-size:1em;font-weight:600;">${val}</span> services
          <div style="font-size:0.8em;color:#666;margin-top:2px;">${percent}% of total</div>
        </div>
      `;
      tooltip.style.display = 'block';
      const tooltipRect = tooltip.getBoundingClientRect();
      let x = evt.clientX + 5; // Offset from cursor
      let y = evt.clientY + 5; // Offset from cursor

      // Prevent overflow right
      if (x + tooltipRect.width > window.innerWidth) x = window.innerWidth - tooltipRect.width - 2;
      // Prevent overflow bottom
      if (y + tooltipRect.height > window.innerHeight) y = window.innerHeight - tooltipRect.height - 2;
      // Prevent overflow left
      if (x < 0) x = 2;
      // Prevent overflow top
      if (y < 0) y = 2;

      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.style.zIndex = 99999; // Raised z-index
      document.body.appendChild(tooltip); // Append to body for fixed positioning

    }

    }
    // Explanations for radar axes
    function radarTooltipExplain(label) {
      switch(label) {
        case 'Essential Services': return 'Core services: healthcare, education, groceries, and transportation (max 20 services)';
        case 'Transportation': return 'Public transport and mobility services (max 12 services)';

    function exportData(format) {
      if (!currentData) return;

      let data, filename, mimeType;

      switch(format) {
        case 'json':
          data = JSON.stringify(currentData, null, 2);
          filename = '15min_city_data.json';
          mimeType = 'application/json';
          break;
        case 'csv':
          data = convertToCSV(currentData);
          filename = '15min_city_data.csv';
          mimeType = 'text/csv';
          break;
        case 'excel':
          data = convertToExcel(currentData);
          filename = '15min_city_data.xlsx';
          mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
          break;
        case 'pdf':
          generatePDF(currentData);
          return;
      }

      const blob = new Blob([data], { type: mimeType });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
      exportMenu.classList.remove('show');
    }

    function convertToCSV(data) {
      const features = data.features;
      if (!features || !features.length) return '';

      const headers = Object.keys(features[0].properties);
      const csvRows = [headers.join(',')];

      features.forEach(feature => {
        const values = headers.map(header => {
          const value = feature.properties[header];
          return typeof value === 'string' ? `"${value.replace(/"/g, '""')}"` : value;
        });
        csvRows.push(values.join(','));
      });

      return csvRows.join('\n');
    }

    function calculateScore(data) {
      const features = data.features;
      const categoryCounts = {};
      features.forEach(f => {
        const cat = f.properties.mainCategory || 'Other';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      
      const total = features.length;
      const uniqueCats = Object.keys(categoryCounts).length;
      const essentialCats = ['Transportation','Healthcare','Education','Groceries'];
      const essentialsPresent = essentialCats.filter(cat => categoryCounts[cat] > 0).length;
      
      let essentialsScore = (essentialsPresent / essentialCats.length) * 40;
      let diversityScore = Math.min(1, uniqueCats / Object.keys(categoryColors).length) * 30;
      let densityScore = Math.min(1, total / 60) * 20;
      
      let entropy = 0;
      if (total > 0) {
        for (const cat in categoryCounts) {
          const p = categoryCounts[cat] / total;
          entropy -= p * Math.log2(p);
        }
        entropy = entropy / Math.log2(Object.keys(categoryColors).length);
      }
      let balanceScore = entropy * 10;
      
      return Math.round(essentialsScore + diversityScore + densityScore + balanceScore);
    }

    function generateDescription(data) {
      const features = data.features;
      const categoryCounts = {};
      features.forEach(f => {
        const cat = f.properties.mainCategory || 'Other';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      
      const total = features.length;
      const uniqueCats = Object.keys(categoryCounts).length;
      const essentialCats = ['Transportation','Healthcare','Education','Groceries'];
      const essentialsPresent = essentialCats.filter(cat => categoryCounts[cat] > 0).length;
      
      let desc = `This area contains ${total} services across ${uniqueCats} categories. `;
      
      const topCats = Object.entries(categoryCounts)
        .sort((a,b) => b[1] - a[1])
        .slice(0,2)
        .map(([cat]) => cat);
      
      if (topCats.length) {
        desc += `The most prevalent services are ${topCats.join(' and ')}. `;
      }
      
      const missing = essentialCats.filter(cat => !categoryCounts[cat] || categoryCounts[cat] === 0);
      if (missing.length > 0) {
        desc += `Missing essential services include: ${missing.join(', ')}. `;
      } else {
        desc += 'All essential services are present. ';
      }
      
      return desc;
    }

    function getCategories(data) {
      const features = data.features;
      const categoryCounts = {};
      features.forEach(f => {
        const cat = f.properties.mainCategory || 'Other';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      
      const total = features.length;
      return Object.entries(categoryCounts)
        .map(([name, count]) => ({
          name,
          count,
          percentage: ((count / total) * 100).toFixed(1)
        }))
        .sort((a, b) => b.count - a.count);
    }

    function generateRecommendations(data) {
      const features = data.features;
      const categoryCounts = {};
      features.forEach(f => {
        const cat = f.properties.mainCategory || 'Other';
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      
      const recommendations = [];
      
      // Check essential services
      const essentialCats = ['Transportation','Healthcare','Education','Groceries'];
      const missingEssentials = essentialCats.filter(cat => !categoryCounts[cat] || categoryCounts[cat] === 0);
      if (missingEssentials.length > 0) {
        recommendations.push(`Priority should be given to establishing ${missingEssentials.join(', ')} services in this area.`);
      }
      
      // Check green spaces
      if ((categoryCounts['Outdoor leisure & activities'] || 0) < 2) {
        recommendations.push('Consider developing more green spaces and recreational areas.');
      }
      
      // Check cultural venues
      if ((categoryCounts['Entertainment & Culture'] || 0) < 2) {
        recommendations.push('Cultural and social venues could be enhanced to improve community engagement.');
      }
      
      // Check retail diversity
      const retailCats = ['Other retail', 'Groceries', 'Financial'];
      const retailCount = retailCats.reduce((sum, cat) => sum + (categoryCounts[cat] || 0), 0);
      if (retailCount < 5) {
        recommendations.push('Retail services could be diversified to better serve the community.');
      }
      
      return recommendations.join(' ');

        'Education': 1.2,
        'Healthcare': 1.2,
        'Entertainment & Culture': 1.1,
        'Sports': 1.1,
        'Transportation': 1.0,
        'Outdoor leisure & activities': 1.0,
        'Other retail': 0.9,
        'Groceries': 0.9,
        'Financial': 0.8,
        'Other': 0.7
      };

      let weightedSum = 0;
      let totalWeight = 0;

      for (const [category, count] of Object.entries(categoryCounts)) {
        const weight = infrastructureFactors[category] || 0.7;
        weightedSum += count * weight;
        totalWeight += weight;
      }

      return ((weightedSum / totalWeight) * 10).toFixed(1);
    }

    function calculateEconomicOpportunity(categoryCounts) {
      const opportunityFactors = {
        'Other retail': 1.2,
        'Financial': 1.2,
        'Entertainment & Culture': 1.1,
        'Education': 1.1,
        'Healthcare': 1.0,
        'Transportation': 1.0,
        'Groceries': 0.9,
        'Sports': 0.9,
        'Outdoor leisure & activities': 0.8,
        'Other': 0.7
      };

      let weightedSum = 0;
      let totalWeight = 0;

      for (const [category, count] of Object.entries(categoryCounts)) {
        const weight = opportunityFactors[category] || 0.7;
        weightedSum += count * weight;
        totalWeight += weight;
      }

      return ((weightedSum / totalWeight) * 10).toFixed(1);
    }

    function calculateCategoryImpact(category, count, total) {
      const impactFactors = {
        'Healthcare': 1.2,
        'Education': 1.2,
        'Transportation': 1.1,
        'Groceries': 1.1,
        'Entertainment & Culture': 1.0,
        'Sports': 1.0,
        'Outdoor leisure & activities': 0.9,
        'Other retail': 0.9,
        'Financial': 0.8,
        'Other': 0.7
      };

      const weight = impactFactors[category] || 0.7;
      return ((count / total) * weight * 10).toFixed(1);
    }

    function calculateCategoryPotential(category) {
      const potentialFactors = {
        'Entertainment & Culture': 1.2,
        'Education': 1.2,
        'Healthcare': 1.1,
        'Transportation': 1.1,
        'Other retail': 1.0,
        'Sports': 1.0,
        'Outdoor leisure & activities': 0.9,
        'Groceries': 0.9,
        'Financial': 0.8,
        'Other': 0.7
      };

      return (potentialFactors[category] || 0.7) * 10;
    }

    function generateEnhancedDescription(analytics, categoryCounts, total) {
      let description = '';

      // Overall Assessment
      description += `<b>Urban Profile:</b> This area demonstrates a comprehensive urban ecosystem with <b>${total}</b> services and a density of <b>${analytics.serviceDensity}</b> services per square kilometer. `;

      // Urban Vitality
      description += `The urban vitality score of <b>${analytics.urbanVitality}/10</b> indicates ${analytics.urbanVitality > 8 ? 'exceptional' : analytics.urbanVitality > 6 ? 'strong' : 'moderate'} urban dynamism. `;

      // Social and Economic Analysis
      description += `Social cohesion is rated at <b>${analytics.socialCohesion}/10</b>, while economic diversity scores <b>${analytics.economicDiversity}/10</b>. `;

      // Environmental Quality
      description += `Environmental quality is assessed at <b>${analytics.environmentalQuality}/10</b>, ${analytics.environmentalQuality > 8 ? 'demonstrating excellent environmental standards' : analytics.environmentalQuality > 6 ? 'showing good environmental practices' : 'indicating room for environmental improvement'}. `;

      // Quality of Life
      description += `The overall quality of life score of <b>${analytics.qualityOfLife}/10</b> reflects ${analytics.qualityOfLife > 8 ? 'an exceptional living environment' : analytics.qualityOfLife > 6 ? 'a good quality of life' : 'opportunities for quality of life enhancement'}. `;

      // Top Categories Analysis
      if (analytics.topCategories.length > 0) {
        description += `The dominant service categories are <b>${analytics.topCategories.map(c => `${c.category} (${c.percentage}%, Impact: ${c.impact}/10)`).join(', ')}</b>. `;
      }

      // Essential Services Analysis
      description += `Essential services coverage is at <b>${analytics.essentialCoverage}%</b>, with ${analytics.missingEssentials.length > 0 ? 
        `missing <b>${analytics.missingEssentials.join(', ')}</b>. ` : 
        'all essential services present. '}`;

      // Development Potential
      description += `The area shows a development potential of <b>${analytics.developmentPotential}/10</b>, with a resilience score of <b>${analytics.resilienceScore}/10</b> and innovation potential of <b>${analytics.innovationPotential}/10</b>. `;

      // Walkability and Accessibility
      description += `Walkability is rated at <b>${analytics.walkabilityScore}/10</b>, while accessibility scores <b>${analytics.accessibilityScore}/10</b>. `;

      // Rare Categories with Potential
      if (analytics.rareCategories.length > 0) {
        description += `Notable rare services with high potential include <b>${analytics.rareCategories.map(c => `${c.category} (Potential: ${c.potential}/10)`).join(', ')}</b>. `;
      }

      return description;
    }

    function generateEnhancedRecommendations(analytics, categoryCounts) {
      let recommendations = [];

      // Priority Development Recommendations
      if (analytics.missingEssentials.length > 0) {
        recommendations.push(`<b>Priority Development:</b> Focus on establishing ${analytics.missingEssentials.join(', ')} services to improve essential service coverage.`);
      }

      // Urban Vitality Enhancement
      if (parseFloat(analytics.urbanVitality) < 7) {
        recommendations.push(`<b>Urban Vitality:</b> Enhance urban vitality through mixed-use development and cultural programming.`);
      }

      // Social Cohesion Improvement
      if (parseFloat(analytics.socialCohesion) < 7) {
        recommendations.push(`<b>Social Cohesion:</b> Strengthen community bonds through shared spaces and social infrastructure.`);
      }

      // Economic Development
      if (parseFloat(analytics.economicDiversity) < 7) {
        recommendations.push(`<b>Economic Development:</b> Diversify economic activities and support local businesses.`);
      }

      // Environmental Enhancement
      if (parseFloat(analytics.environmentalQuality) < 7) {
        recommendations.push(`<b>Environmental Quality:</b> Improve green spaces and promote sustainable practices.`);
      }

      // Quality of Life Improvements
      if (parseFloat(analytics.qualityOfLife) < 7) {
        recommendations.push(`<b>Quality of Life:</b> Enhance living conditions through better service quality and accessibility.`);
      }

      // Development Potential
      if (parseFloat(analytics.developmentPotential) > 7) {
        recommendations.push(`<b>Development Opportunities:</b> Leverage high development potential for strategic urban growth.`);
      }

      // Resilience Building
      if (parseFloat(analytics.resilienceScore) < 7) {
        recommendations.push(`<b>Resilience Building:</b> Strengthen urban resilience through diversified services and infrastructure.`);
      }

      // Innovation Support
      if (parseFloat(analytics.innovationPotential) > 7) {
        recommendations.push(`<b>Innovation Support:</b> Foster innovation through educational and cultural initiatives.`);
      }

      return recommendations.join('<br><br>');
    }
  </script>
